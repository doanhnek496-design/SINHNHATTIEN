<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff5f8"><title>Birthday surprise • Thanh Tiền</title><link rel="stylesheet" href="style.css"><style>

.music-toggle{position:fixed;right:14px;bottom:14px;z-index:9999;border:1px solid #e8b8ca;background:rgba(255,248,250,.94);color:#9b6078;border-radius:999px;padding:11px 15px;font:600 14px system-ui;box-shadow:0 5px 18px #b77b8b22;backdrop-filter:blur(8px);cursor:pointer;transition:transform .2s,background .2s}

<body class="gate-page"><div class="ambient a1"></div><div class="ambient a2"></div><main class="gate-wrap"><section class="gate-card"><div class="eyebrow"><span class="sparkle">✦</span> A LITTLE SURPRISE FOR YOU <span class="sparkle">✦</span></div><div class="avatar-ring"><img src="images/avatar.jpg" class="avatar" alt="Ảnh kỷ niệm"></div><p class="overline">HAPPY BIRTHDAY</p><h1>Thanh Tiền <span>✿</span></h1><p class="intro">Một món quà nhỏ dành cho cô bạn thân đặc biệt.</p><div class="friend-chip"><span>♡</span> BEST FRIENDS, ALWAYS <span>♡</span></div><label class="pass-label" for="password">Mở chiếc hộp bí mật</label><div class="pass-display" id="passDisplay" aria-live="polite"><span id="passwordDots">○ ○ ○ ○ ○ ○</span><small id="passCount">0/6</small></div><div class="keypad" aria-label="Bàn phím mật khẩu"><button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="utility" id="clearBtn">XÓA</button><button data-num="0">0</button><button class="utility" id="backBtn">⌫</button></div><button class="unlock-btn" id="unlockBtn">Mở bất ngờ <span>↗</span></button><p class="feedback" id="feedback" role="status">Gợi ý: mật mã có 6 chữ số ✨</p></section><footer>Made with care · tình bạn là một món quà</footer></main><script src="script.js"></script><script src="music.js"></script></body></html>
